name: Update visual baselines
# Manual: run from the Actions tab after an intentional design change.
# Renders in the same Linux image as the CI e2e job, then uploads the new PNGs as an artifact.
on: workflow_dispatch
jobs:
  update:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: docs_e2e }
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/docs_e2e
      SESSION_SECRET: ci-secret
      BASE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:setup
      - run: npm run build
      - name: Start production server
        run: |
          PORT=3100 npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3100/login > /dev/null && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: npm run test:e2e:update
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: e2e/__screenshots__/
